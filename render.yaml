services:
  - type: web
    name: signbridge
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/download_assets.py
    startCommand: gunicorn app.server:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SECRET_KEY
        generateValue: true
